name: Kubernetes M4

on:
  push:
    branches: [main]
    paths: ['k8s/**', '.github/workflows/k8s.yml']
  pull_request:
    paths: ['k8s/**', '.github/workflows/k8s.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install kind and kubectl
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' | sha256sum -c -
          curl -fsSLO https://dl.k8s.io/v1.37.1/kubernetes-client-linux-amd64.tar.gz
          echo 'decde4d990d0fbf6451e65524dec42c549de3339f27005c45af8d3c61cca1de852524ebf2215c82be86d4ab2621c823f56f718b8d2c304b9100a903e696c0c32  kubernetes-client-linux-amd64.tar.gz' | sha512sum -c -
          tar -xzf kubernetes-client-linux-amd64.tar.gz kubernetes/client/bin/kubectl
          sudo install -m 0755 kind kubernetes/client/bin/kubectl /usr/local/bin/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Run the official M4 marker
        run: |
          python -m pip install --quiet pyyaml==6.0.3
          curl -fsSLo "$RUNNER_TEMP/mark_m4.py" https://raw.githubusercontent.com/inf345/inf345-week9-lab/main/mark_m4.py
          python "$RUNNER_TEMP/mark_m4.py" --path . --kind
